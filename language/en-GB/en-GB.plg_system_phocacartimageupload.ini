;[6.1.7]
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_HARDEN_UPLOAD_FOLDER_LABEL="Write .htaccess / web.config"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_HARDEN_UPLOAD_FOLDER_DESC="Automatically create .htaccess (Apache) and web.config (IIS) files in each upload folder to block script execution. Disable this on servers where these files cause errors (e.g. AllowOverride restrictions); an index.html placeholder that blocks directory listing is always created regardless of this setting."

;[6.1.2]
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_MAX_IMAGES_LABEL="Maximum images"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_MAX_IMAGES_DESC="Maximum total number of images allowed per product. Set to 0 for unlimited."
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_UPLOAD_BATCH_SIZE_LABEL="Files per upload batch"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_PARAM_UPLOAD_BATCH_SIZE_DESC="Number of files sent to the server in a single batch when uploading multiple images. Lower values use less server memory per request; higher values may be faster on good connections. Default: 5."
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_ERROR_MAX_IMAGES_EXCEEDED="Upload limit reached. This product allows a maximum of %s images."
;[6.1.0]
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD="System - Phoca Cart Image Upload"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DESCRIPTION="<div class=\"alert alert-info left\" style=\"text-align: left\"><p>Phoca Cart Image Upload System plugin - provides drag-drop image upload functionality for Phoca Cart product edit view.</p><p>Enable and publish this plugin in <a style=\"text-decoration: underline\" href=\"index.php?option=com_plugins\">Plugin Manager</a></p><p>More information: <a style=\"text-decoration: underline\" href=\"https://www.phoca.cz/\" target=\"_blank\" >Phoca.cz</a></p><p>Documentation: <a style=\"text-decoration: underline\" href=\"https://www.phoca.cz/documentation/\" target=\"_blank\" >Phoca Documentation</a></p><p>Help and Support: <a style=\"text-decoration: underline\" href=\"https://www.phoca.cz/forum/\" target=\"_blank\" >Phoca Forum</a></p></div>"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_COPY_IMAGES_BATCH="Copy Images (Batch Copy)"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_COPY_IMAGES_BATCH_DESC="If you are using this plugin, product images are stored in a folder named after the product ID. When copying a product (batch function), this option defines whether to copy images from the source folder to a new folder named after the new product ID, ensuring the new product does not reference images belonging to a different product. Because some images from other upload features may be stored in different paths that do not contain the source product ID, you can choose whether these images will also be copied using the following options: NO - images are not copied, YES - only images in the source product folder are copied, YES (ALL) - all images, including those from alternative folders, are copied into the new product folder."
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_NO="No"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_YES="Yes"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_YES_ALL="Yes (All)"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_IMAGES="Delete Images"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_IMAGES_DESC="This option defines which images will be physically deleted from the server when deleting them in the image list. PLEASE NOTE: Deleting images that are stored in a different folder than the product ID folder may affect other products or items that reference the same file. ONLY ID FOLDER - only images located in the product ID folder or temporary folder are physically deleted. ALL PATHS - all images in the list are physically deleted from the server regardless of their path."
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_ONLY_ID_FOLDER="Only ID or Temp Folder"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_ALL_PATHS="All Paths"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_FOLDER_PRODUCT="Delete Folder (Product)"
PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DELETE_FOLDER_PRODUCT_DESC="If set to Yes, the product image folder (e.g., images/phocacartproducts/ID) and all its content will be physically deleted from the server when the product is deleted from Phoca Cart."

PLG_SYSTEM_PHOCACARTIMAGEUPLOAD_DRAG_DROP_IMAGES_HERE="Drag & Drop Images Here"
